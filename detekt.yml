build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

comments:
  active: false

complexity:
  active: false

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
  VariableNaming:
    active: false
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'

performance:
  SpreadOperator:
    active: false

potential-bugs:
  EqualsWithHashCodeExist:
    active: true
  UnreachableCode:
    active: true

style:
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
  NewLineAtEndOfFile:
    active: false
  OptionalAbstractKeyword:
    active: true
  ReturnCount:
    active: false
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedParameter:
    active: false
  WildcardImport:
    active: false
